[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smriti-memory"
version = "0.1.0"
description = "Smriti: Bi-Temporal 4-Layer Agent Memory with Dream Consolidation, Linked Entity Wikis, and Claim-Level Provenance"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "dulwich>=0.21.0",
]

[project.scripts]
smriti = "smriti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
